<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rohit AI Chatbot</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #222;
    height: 100vh;
    display: flex;
}

.sidebar {
    width: 250px;
    background: #172033;
    color: white;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #7c9cff;
}

.new-chat {
    padding: 13px;
    background: #29364f;
    color: white;
    border: 1px solid #52617a;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}

.new-chat:hover {
    background: #394966;
}

.sidebar p {
    color: #b9c4d8;
    font-size: 14px;
    line-height: 1.7;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    background: white;
    padding: 18px 24px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h2 {
    font-size: 20px;
}

.status {
    color: #168653;
    font-size: 13px;
}

.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.welcome {
    margin: auto;
    text-align: center;
    max-width: 520px;
    padding: 20px;
}

.robot {
    font-size: 60px;
    margin-bottom: 15px;
}

.welcome h1 {
    font-size: 32px;
    margin-bottom: 12px;
}

.welcome p {
    color: #667085;
    line-height: 1.6;
}

.message {
    max-width: 80%;
    padding: 13px 16px;
    border-radius: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    align-self: flex-end;
    background: #4263eb;
    color: white;
    border-bottom-right-radius: 4px;
}

.bot {
    align-self: flex-start;
    background: white;
    border: 1px solid #e5e7eb;
    border-bottom-left-radius: 4px;
}

.input-box {
    background: white;
    border-top: 1px solid #e5e7eb;
    padding: 18px;
}

.input-row {
    display: flex;
    max-width: 850px;
    margin: auto;
    gap: 10px;
    background: #f5f7fb;
    padding: 8px;
    border: 1px solid #dfe3eb;
    border-radius: 15px;
}

#question {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    padding: 10px;
    font-size: 16px;
}

#send {
    background: #4263eb;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    cursor: pointer;
    font-size: 15px;
}

#send:hover {
    background: #304fce;
}

#send:disabled {
    opacity: 0.6;
    cursor: wait;
}

.note {
    text-align: center;
    color: #9299a6;
    font-size: 12px;
    margin-top: 10px;
}

@media (max-width: 600px) {
    .sidebar {
        width: 65px;
        padding: 12px 6px;
        align-items: center;
    }

    .logo {
        font-size: 14px;
        writing-mode: vertical-rl;
    }

    .new-chat {
        font-size: 22px;
        padding: 10px;
    }

    .sidebar p {
        display: none;
    }

    .header {
        padding: 15px 12px;
    }

    .header h2 {
        font-size: 17px;
    }

    .chat-area {
        padding: 15px 10px;
    }

    .message {
        max-width: 92%;
    }

    .welcome h1 {
        font-size: 25px;
    }

    .input-box {
        padding: 10px;
    }

    #send {
        padding: 10px 12px;
    }
}
</style>
</head>

<body>

<aside class="sidebar">
    <div class="logo">🤖 Rohit AI</div>

    <button class="new-chat" onclick="newChat()"
    title="नई चैट शुरू करें">＋ नई चैट</button>

    <p>
        तुम्हारा अपना AI Chatbot!<br><br>
        सवाल पूछो और चैट करो।<br><br>
        बनाया गया: Rohit Nayak
    </p>
</aside>

<main class="main">

    <header class="header">
        <h2>Rohit AI Chatbot</h2>
        <span class="status">● Demo Mode</span>
    </header>

    <section class="chat-area" id="chatArea">

        <div class="welcome" id="welcome">
            <div class="robot">🤖</div>
            <h1>नमस्ते! 👋</h1>
            <p>
                मैं Rohit AI हूँ।<br>
                मुझसे कुछ भी पूछकर देखो!
            </p>
        </div>

    </section>

    <footer class="input-box">
        <div class="input-row">
            <input
                type="text"
                id="question"
                placeholder="यहाँ अपना सवाल लिखो..."
                autocomplete="off"
            >

            <button id="send" onclick="sendMessage()">
                भेजें ➤
            </button>
        </div>

        <p class="note">
            यह डेमो चैटबॉट है। असली AI जवाबों के लिए API जरूरी है।
        </p>
    </footer>

</main>

<script>
const chatArea = document.getElementById("chatArea");
const questionInput = document.getElementById("question");
const sendButton = document.getElementById("send");

function addMessage(text, sender) {
    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const message = document.createElement("div");
    message.className = "message " + sender;

    // यूजर के टेक्स्ट को सुरक्षित तरीके से दिखाएँ।
    message.textContent = text;

    chatArea.appendChild(message);
    chatArea.scrollTop = chatArea.scrollHeight;

    return message;
}

function getDemoReply(question) {
    const q = question.toLowerCase().trim();

    if (
        q.includes("hello") ||
        q.includes("hi") ||
        q.includes("नमस्ते") ||
        q.includes("हेलो")
    ) {
        return "नमस्ते! 👋 मैं Rohit AI हूँ। बताओ, मैं तुम्हारी क्या मदद करूँ?";
    }

    if (
        q.includes("तुम्हारा नाम") ||
        q.includes("your name") ||
        q.includes("नाम क्या")
    ) {
        return "मेरा नाम Rohit AI Chatbot है। 🤖";
    }

    if (
        q.includes("कौन बनाया") ||
        q.includes("who made") ||
        q.includes("किसने बनाया")
    ) {
        return "यह Rohit Nayak का बनाया हुआ Chatbot Demo है।";
    }

    if (
        q.includes("समय") ||
        q.includes("time")
    ) {
        return "तुम्हारे डिवाइस पर अभी समय है: " +
            new Date().toLocaleTimeString("hi-IN");
    }

    if (
        q.includes("तारीख") ||
        q.includes("date")
    ) {
        return "आज की तारीख है: " +
            new Date().toLocaleDateString("hi-IN");
    }

    if (
        q.includes("धन्यवाद") ||
        q.includes("thank")
    ) {
        return "तुम्हारा स्वागत है! 😊";
    }

    return "तुमने पूछा: " + question +
        "\n\nयह अभी Demo Mode में है। " +
        "असली AI की तरह नए सवालों के जवाब देने के लिए " +
        "इसमें AI API जोड़नी होगी।";
}

function sendMessage() {
    const question = questionInput.value.trim();

    if (!question || sendButton.disabled) {
        return;
    }

    addMessage(question, "user");

    questionInput.value = "";
    sendButton.disabled = true;

    const loading = addMessage("जवाब तैयार हो रहा है...", "bot");

    setTimeout(() => {
        loading.textContent = getDemoReply(question);
        chatArea.scrollTop = chatArea.scrollHeight;
        sendButton.disabled = false;
        questionInput.focus();
    }, 500);
}

function newChat() {
    chatArea.replaceChildren();

    const welcome = document.createElement("div");
    welcome.className = "welcome";
    welcome.id = "welcome";

    const robot = document.createElement("div");
    robot.className = "robot";
    robot.textContent = "🤖";

    const heading = document.createElement("h1");
    heading.textContent = "नमस्ते! 👋";

    const paragraph = document.createElement("p");
    paragraph.textContent = "मैं Rohit AI हूँ। मुझसे कुछ भी पूछकर देखो!";

    welcome.append(robot, heading, paragraph);
    chatArea.appendChild(welcome);

    questionInput.value = "";
    sendButton.disabled = false;
    questionInput.focus();
}

questionInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
